name: release-typescript

on:
  push:
    tags:
      - 'typescript/*'
  workflow_dispatch:
    inputs:
      tag:
        description: TypeScript release tag to process, for example typescript/v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - name: validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            typescript/v*) ;;
            *) echo "expected a typescript/vX.Y.Z tag, got $RELEASE_TAG" >&2; exit 1 ;;
          esac

          VERSION="${RELEASE_TAG#typescript/v}"
          test "$(npm pkg get version | tr -d '"')" = "$VERSION"
          grep -Fq "## [v$VERSION]" CHANGELOG.md || grep -Fq "## [$VERSION]" CHANGELOG.md

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

      # 契约：五个语言包与 tests/contract/package.json 的领域名、版本必须一致
      - name: contract（五语言一致）
        run: sh ../../scripts/contract.sh typescript

  publish:
    needs: quality-gates
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/typescript/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - run: npm ci

      - name: publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}

  # GitHub Release：注册表发布成功后，在仓库里补一条 Release（生成变更说明，预发布打标）。
  # tag 是唯一事实源，Release 由 workflow 补上——无论 tag 怎么推上来，Releases 页都不缺版本。
  github-release:
    needs: publish
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/typescript/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --generate-notes

      - name: mark prerelease when applicable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#typescript/v}"
          case "$VERSION" in
            *-alpha.*|*-beta.*|*-rc.*)
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease
              ;;
          esac
