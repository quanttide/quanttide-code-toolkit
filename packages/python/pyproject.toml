[project]
name = "quanttide-code"
version = "0.1.0"
description = "软件工程工具箱（Python 包）：软件工程领域的共享能力"
readme = "README.md"
authors = [
    { name = "Guo Zhang", email = "zhangguo@quanttide.com" }
]
requires-python = ">=3.12"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
